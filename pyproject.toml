[project]
name = "spotify-genre-sorter"
version = "0.1.0"
description = "Given a set of Spotify songs, automatically group all songs in sorted playlists."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "typer>=0.26.7",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "docstring-tailor>=0.4.1",
    "pyright>=1.1.414",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.11.6",
    "ty>=0.0.29",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
]

# Pytest settings.

[tool.pytest.ini_options]
pythonpath = ["."]

# Docstring tailor settings.

[tool.docstring_tailor]
line-length = 80
style = "google"

# Dependency checker settings.

[tool.deptry]
known_first_party = ["sgs"]

# Ruff settings.

[tool.ruff.lint]
extend-select = ["I", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["sgs"]

# Build system and backend.

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sgs"
module-root = "src"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "I001"]  # tests are not held to annotation rules or import sorting
